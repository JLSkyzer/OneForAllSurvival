plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Contenu d'essai : gabarits de GameTest chargés par les lancements de développement,
// jamais empaquetés dans le mod livré.
sourceSets {
    devcontent
    // Fenêtre de chargement anticipée : jar de service à part (ImmediateWindowProvider « lostisland »),
    // chargé par FML avant le jeu. Aucune classe de Minecraft ici : il tourne avant que le jeu existe.
    earlywindow
    // Tests unitaires du jar de service (JUnit seul, aucune classe de Minecraft).
    earlywindowTest
}

configurations {
    devcontentImplementation.extendsFrom implementation
    // fmlloader, fmlearlydisplay, LWJGL et Gson, déjà résolus pour le mod, sans nouveau téléchargement.
    earlywindowCompileClasspath.extendsFrom compileClasspath
    earlywindowTestImplementation.extendsFrom earlywindowImplementation
    earlywindowTestCompileClasspath.extendsFrom earlywindowCompileClasspath
    // Gson à l'exécution : le jar de service le trouve dans Minecraft, pas les tests.
    earlywindowTestRuntimeClasspath.extendsFrom compileClasspath
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Les mixins des mods du pack, remappés par fg.deobf, retrouvent leurs cibles
            // sous les noms de développement.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // Le contenu d'essai, en développement seulement.
                    source sourceSets.devcontent
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
            // Fenêtre de chargement : `-PsceneFrames=<dossier>` enregistre le film de la scène (relatif à run/),
            // `-PearlyWindowFail[=true|late|render]` force le repli sur l'écran de Forge : avant notre fenêtre
            // (true), après notre fenêtre et la scène (late), ou par un échec dans le thread de rendu (render).
            // Un -D sur la ligne de Gradle n'atteindrait pas le jeu : ce sont des propriétés du lancement.
            if (project.hasProperty('sceneFrames')) {
                property 'lostisland.frames', project.sceneFrames
            }
            if (project.hasProperty('earlyWindowFail')) {
                property 'lostisland.earlywindow.fail', project.earlyWindowFail ?: 'true'
            }
            // `-PreloadAfterTitle` : un rechargement des packs de ressources une fois l'écran titre atteint
            // (overlay de Mojang après notre scène libérée). Voir ReloadAfterTitle (devcontent).
            if (project.hasProperty('reloadAfterTitle')) {
                property 'lostisland.reloadAfterTitle', 'true'
            }
            // `-PtitleShots=<dossier>` : captures de contrôle de l'écran titre (relatif au dossier du jeu, frames-titre
            // par défaut), puis fermeture du client ; `-PtitleShotsServer=<hôte:port>` y ajoute la preuve de la
            // déconnexion d'un serveur. Voir TitleShots (devcontent). Valent aussi pour titleFr (même parent).
            if (project.hasProperty('titleShots')) {
                property 'lostisland.titleShots', project.titleShots ?: 'frames-titre'
            }
            if (project.hasProperty('titleShotsServer')) {
                property 'lostisland.titleShots.server', project.titleShotsServer
            }
            // `-PdebugShots=<dossier>` : preuve en jeu du F3 (relatif au dossier du jeu), puis fermeture du client ;
            // `-PdebugShotsFilm` : version filmée, sans images PNG. `-PgameArgs="--fullscreen --width 2560 --height 1440"` :
            // arguments de lancement de Minecraft, sans toucher à options.txt. Voir F3Shots (devcontent).
            if (project.hasProperty('debugShots')) {
                property 'lostisland.debugShots', project.debugShots ?: 'frames-f3'
            }
            if (project.hasProperty('debugShotsFilm')) {
                property 'lostisland.debugShots.film', 'true'
            }
            if (project.hasProperty('gameArgs')) {
                args project.gameArgs.trim().split(/\s+/).toList()
            }
            // `-PoverlayFail=first` : la première image de l'overlay du mod échoue, celui de Forge prend la main.
            // `-PprogressTrace` : relevé de l'avancement des ressources une fois par seconde au journal de la scène.
            if (project.hasProperty('overlayFail')) {
                property 'lostisland.overlay.fail', project.overlayFail ?: 'first'
            }
            if (project.hasProperty('progressTrace')) {
                property 'lostisland.progress.trace', 'true'
            }
            // Pont du passage aux ressources : `-PbridgeThread=auto|false|force` (l'emporte sur
            // config/lostisland-earlywindow.properties), `-PbridgeThreadFail` fait échouer la création du second
            // contexte, `-PactiveProcessors=2` simule un petit PC (`-XX:ActiveProcessorCount`, vu par
            // Runtime.availableProcessors()).
            if (project.hasProperty('bridgeThread')) {
                property 'lostisland.bridgeThread', project.bridgeThread ?: 'auto'
            }
            if (project.hasProperty('bridgeThreadFail')) {
                property 'lostisland.bridgeThread.fail', 'true'
            }
            // `-PbridgeSlowStop=<ms>` : essai du pont en retard, il garde son verrou ce temps-là à la demande d'arrêt.
            if (project.hasProperty('bridgeSlowStop')) {
                property 'lostisland.bridgeThread.slowStop', project.bridgeSlowStop ?: '2500'
            }
            if (project.hasProperty('activeProcessors')) {
                jvmArg "-XX:ActiveProcessorCount=${project.activeProcessors}"
            }
        }

        // Second joueur pour essayer le multijoueur et les rôles : se connecte au client
        // (ouvrir le monde au LAN) ou à `runServer`, dans son propre dossier.
        client2 {
            parent minecraft.runs.client
            workingDirectory project.file('run-client2')
            args '--username', 'Dev2'
        }

        // Essais de l'écran titre en français (dev seulement) : son propre dossier, pour ne jamais toucher
        // aux réglages de run/. Préparé par prepareTitleRun (jar de service, fml.toml, options.txt).
        titleFr {
            parent minecraft.runs.client
            workingDirectory project.file('run-titre')
        }

        // Démonstration filmée (dev seulement) : un client qui se pilote seul, monte les scènes des
        // réseaux et enregistre ses images dans run-demo/frames. Voir DemoReseaux (devcontent).
        demo {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '720'
        }

        // Capture de contrôle de l'écran de l'établi (dev seulement) : ouvre le vrai écran dans un monde
        // intégré avec le pack complet et écrit des images dans run-demo/etabli-captures. Voir DemoEtabli.
        demoEtabli {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.etabli', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '720'
        }

        // Même capture dans une fenêtre de 960 x 540 : 320 x 180 pixels d'interface à l'échelle 3, soit la
        // mise en page la plus serrée (Minecraft plafonne l'échelle pour garder au moins 320 x 240 en 720p).
        demoEtabliPetit {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.etabli', 'true'
            property 'oneforallsurvival.demo.etabli.sous', 'gui320x180'
            property 'oneforallsurvival.demo.etabli.forcer', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '960', '--height', '540'
        }

        // Capture de contrôle des visuels du lot 2 (dev seulement) : le bain dans ses quatre états, les débris, tous
        // les objets, l'écran du bain et sa catégorie JEI, dans run-demo/visuels-captures. Voir DemoVisuels.
        demoVisuels {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.visuels', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '720'
        }

        // Preuve de bout en bout (dev seulement) : un client qui se connecte seul à `runServer` sur localhost,
        // joue un craft complet et arrête le serveur par /stop. Voir E2eClient (devcontent).
        e2eClient {
            parent minecraft.runs.client
            workingDirectory project.file('run-e2e')
            property 'oneforallsurvival.e2e', '127.0.0.1'
            property 'oneforallsurvival.jeicheck', 'true'
            jvmArgs '-Xmx3G'
            args '--username', 'Dev', '--width', '1280', '--height', '656'
        }

        // Seconde phase de la preuve (dev seulement) : après un arrêt et une relance de `runServer`, le même client relit
        // sur le disque du serveur l'usure, la panne, la protection et la zone. Voir E2eReparation (devcontent).
        e2eRelance {
            parent minecraft.runs.client
            workingDirectory project.file('run-e2e')
            property 'oneforallsurvival.e2e', '127.0.0.1'
            property 'oneforallsurvival.e2e.relance', 'true'
            jvmArgs '-Xmx3G'
            args '--username', 'Dev', '--width', '1280', '--height', '656'
        }

        // Film du métier de réparation (dev seulement) : un client qui se pilote seul et enregistre ses images dans
        // run-demo/frames-reparation, un bandeau de légende en dessous. Voir FilmReparation (devcontent).
        demoReparationFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.reparation', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        // Film de démonstration de l'établi (dev seulement) : un client qui se pilote seul et enregistre ses
        // images dans run-demo/frames-etabli, un bandeau de légende en dessous. Voir FilmEtabli (devcontent).
        demoEtabliFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.film', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        // Film du lot 3 (dev seulement) : un client qui se pilote seul et enregistre ses images dans
        // run-demo/frames-vivres, un bandeau de légende en dessous. Voir FilmVivres (devcontent).
        demoVivresFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.vivres', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        // Film du lot 4 (dev seulement) : un client qui se pilote seul et enregistre ses images dans
        // run-demo/frames-reseau, un bandeau de légende en dessous. Voir FilmReseau (devcontent).
        demoReseauFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.reseau', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        // Film du lot 5 (dev seulement) : un client qui se pilote seul et enregistre ses images dans
        // run-demo/frames-protection, un bandeau de légende en dessous. Voir FilmProtection (devcontent).
        demoProtectionFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.protection', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        // Film du lot 6 (dev seulement) : un client qui se pilote seul et enregistre ses images dans
        // run-demo/frames-ville, un bandeau de légende en dessous. Voir FilmVille (devcontent).
        demoVilleFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.ville', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        // Film du lot 7 (dev seulement) : un client qui se pilote seul et enregistre ses images dans
        // run-demo/frames-exploration, un bandeau de légende en dessous. Voir FilmExploration (devcontent).
        demoExplorationFilm {
            parent minecraft.runs.client
            workingDirectory project.file('run-demo')
            property 'oneforallsurvival.demo.exploration', 'true'
            jvmArgs '-Xmx3G'
            args '--width', '1280', '--height', '656'
        }

        server {
            // Un dossier à part : un client lancé en même temps tourne dans `run`.
            workingDirectory project.file('run-server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            // Un dossier à part, dont le monde est effacé avant chaque passage (voir plus bas).
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Mixins du mod (la première fois : cases d'inventaire et entonnoir, tâche 3 du lot E1). Ils ne visent que des
// classes de Minecraft et de Forge. La refmap est produite par MixinGradle ; reobfJar la remappe pour le jar livré.
// Le plugin ajoute `--mixin.config` à chaque lancement de `minecraft.runs`, GameTests et clients compris.
mixin {
    add sourceSets.main, 'oneforallsurvival.refmap.json'
    config 'oneforallsurvival.mixins.json'
}

// Le jar livré déclare sa configuration de mixins, Forge la lit dans le manifeste.
tasks.named('jar', Jar).configure {
    manifest {
        attributes('MixinConfigs': 'oneforallsurvival.mixins.json')
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// L'overlay des ressources du mod (client/loading) compile contre les classes du jar de service, à la
// compilation seulement : à l'exécution, elles viennent du jar posé dans run/mods (couche des services). Les
// ajouter au classpath des lancements les mettrait aussi dans la couche du jeu, en double. Le classpath de
// compilation du sourceSet, et non la configuration compileOnly : earlywindowCompileClasspath étend
// compileClasspath, la sortie earlywindow dépendrait alors d'elle-même.
sourceSets.main.compileClasspath += sourceSets.earlywindow.output.classesDirs

repositories {
    // Pas d'exclusiveContent : les versions remappées par fg.deobf, du même groupe, viennent du
    // dépôt local de ForgeGradle.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        // org.openzen.zencode : dépendances transitives de CraftTweaker.
        content {
            includeGroup 'com.blamejared.crafttweaker'
            includeGroup 'org.openzen.zencode'
            // JEI : le dépôt de BlameJared le publie pour Forge et pour Fabric, sous des artefacts distincts.
            includeGroup 'mezz.jei'
            // Bibliothèque de configuration dont dépend JEI.
            includeGroup 'net.mezzdev.config'
        }
    }

    // ESL (bibliothèque d'énergie), embarquée dans New Age : voir le bloc du pack plus bas.
    flatDir {
        dir 'libs'
        content { includeGroup 'local' }
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // JEI : l'API seule à la compilation (le mod reste chargeable sans JEI), le JEI complet dans le pack plus bas.
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")

    // First Aid : l'API seule à la compilation (la clôture lit la tête et le torse du joueur, derrière isLoaded("firstaid")).
    compileOnly fg.deobf("curse.maven:first-aid-276837:${firstaid_file}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // Les GameTests compilent contre le mod et Minecraft.
    devcontentImplementation sourceSets.main.output

    // Dépendance obligatoire du mod.
    implementation fg.deobf("maven.modrinth:farmers-delight:${farmersdelight_version}")

    // Processeur d'annotations des mixins : écrit la refmap du mod.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Tests unitaires
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // TitleLayoutTest compare la disposition à la projection pure du jar de service.
    testImplementation sourceSets.earlywindow.output.classesDirs

    earlywindowTestImplementation sourceSets.earlywindow.output.classesDirs
    earlywindowTestImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    earlywindowTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Le pack de développement : les mods d'ingénierie et de santé que le mod sert.
// Écarté quand une tâche demandée contient `GameTest`, pour garder les GameTests rapides, sauf
// avec `-PwithPack` : ce passage prouve alors que le pack complet se charge et fonctionne.
if (project.hasProperty('withPack') || !gradle.startParameter.taskNames.any { it.contains('GameTest') }) {
    dependencies {
        runtimeOnly fg.deobf("maven.modrinth:create:${create_version}")
        runtimeOnly fg.deobf("maven.modrinth:createaddition:${createaddition_version}")
        runtimeOnly fg.deobf("maven.modrinth:create-new-age:${createnewage_version}")
        // ESL est imbriqué (jarjar) dans New Age, et fg.deobf ne remappe pas les jars imbriqués :
        // il resterait en noms SRG, et son mixin planterait en développement (NoSuchMethodError
        // sur BlockEntity.m_58903_). On le sort de libs/ pour le remapper nous-mêmes.
        runtimeOnly fg.deobf("local:esl-forge-1.20.1:${esl_version}")
        runtimeOnly fg.deobf("curse.maven:create-advanced-electricity-addon-1743391:${advancedelectricity_file}")
        runtimeOnly fg.deobf("maven.modrinth:hospitals:${hospitals_version}")
        runtimeOnly fg.deobf("curse.maven:medical-remedies-1185929:${medicalremedies_file}")
        runtimeOnly fg.deobf("curse.maven:first-aid-276837:${firstaid_file}")
        runtimeOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-1.20.1:${crafttweaker_version}")
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Tests du jar de service : `./gradlew test` les lance aussi, résultats sous build/test-results/earlywindowTest.
def earlyWindowTest = tasks.register('earlywindowTest', Test) {
    group = 'verification'
    description = 'Lance les tests unitaires du jar de service de la fenêtre anticipée.'
    testClassesDirs = sourceSets.earlywindowTest.output.classesDirs
    classpath = sourceSets.earlywindowTest.runtimeClasspath
    useJUnitPlatform()
    workingDir = project.projectDir
}
tasks.named('test').configure { dependsOn earlyWindowTest }

// ForgeGradle crée ses tâches run après l'évaluation du script : `tasks.named` échouerait ici,
// `tasks.matching {}.configureEach` configure la tâche dès qu'elle apparaît.
// La démonstration repart d'un monde et d'images neufs.
tasks.matching { it.name == 'runDemo' }.configureEach {
    doFirst {
        delete project.file('run-demo/saves')
        delete project.file('run-demo/frames')
    }
}

tasks.matching { it.name == 'runE2eClient' }.configureEach {
    doFirst {
        delete project.file('run-e2e/frames-e2e')
    }
}

tasks.matching { it.name == 'runE2eRelance' }.configureEach {
    doFirst {
        delete project.file('run-e2e/frames-e2e-relance')
    }
}

tasks.matching { it.name == 'runDemoReparationFilm' }.configureEach {
    doFirst {
        delete project.file('run-demo/saves/film_reparation')
        delete project.file('run-demo/frames-reparation')
    }
}

tasks.matching { it.name == 'runDemoVivresFilm' }.configureEach {
    doFirst {
        delete project.file('run-demo/saves/film_vivres')
        delete project.file('run-demo/frames-vivres')
    }
}

tasks.matching { it.name == 'runDemoReseauFilm' }.configureEach {
    doFirst {
        delete project.file('run-demo/saves/film_reseau')
