tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        // Les GameTests partent d'un monde neuf.
        delete project.file('run-gametest/world')

        // Le serveur de GameTest de Forge construit son monde à partir de server.properties (non versionné) :
        // on l'écrit ici pour que le monde d'essai soit toujours le même. Un terrain plat au biome vide, sans
        // structure (donc sans village). Les apparitions sont coupées par la règle doMobSpawning, posée avec les autres
        // règles par MondeDEssai ; les clés spawn-* ne jouent pas sur un serveur de GameTest, elles restent pour la forme.
        def fichier = project.file('run-gametest/server.properties')
        def proprietes = new Properties()
        if (fichier.isFile()) {
            fichier.withInputStream { proprietes.load(it) }
        }
        proprietes.setProperty('level-type', 'minecraft:flat')
        proprietes.setProperty('generator-settings', '{"biome":"minecraft:the_void","features":false,"lakes":false,'
                + '"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":3}],'
                + '"structure_overrides":[]}')
        proprietes.setProperty('generate-structures', 'false')
        proprietes.setProperty('spawn-monsters', 'false')
        proprietes.setProperty('spawn-animals', 'false')
        proprietes.setProperty('spawn-npcs', 'false')
        fichier.parentFile.mkdirs()
        fichier.withOutputStream { proprietes.store(it, 'Reecrit par build.gradle pour les GameTests') }
    }
}

// Le jar de service de la fenêtre anticipée : classes `earlywindow` seulement, sans mods.toml. FML le met dans
// la couche SERVICE parce qu'il déclare un ImmediateWindowProvider (ModDirTransformerDiscoverer).
def earlyWindowJar = tasks.register('earlyWindowJar', Jar) {
    group = 'build'
    description = 'Construit le jar de service de la fenêtre de chargement Lost Island.'
    archiveBaseName = "${mod_id}-earlywindow"
    archiveVersion = mod_version
    from sourceSets.earlywindow.output
    manifest {
        attributes([
                'Automatic-Module-Name'   : "${mod_id}.earlywindow",
                'Implementation-Title'    : "${mod_id}-earlywindow",
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// Les calques de la scène viennent de art/ (hors du dépôt) et sont copiés tels quels, sans recompression,
// sous lostisland/loading/ dans le jar de service.
def calquesEcran = project.file('art/loading-screen/assets')
def verifierCalques = tasks.register('verifierCalquesEcran') {
    group = 'verification'
    description = "Echoue avec un message clair si les calques de l'ecran de chargement manquent."
    doLast {
        if (!new File(calquesEcran, 'manifest.json').isFile()) {
            throw new GradleException("Calques de l'ecran de chargement introuvables : ${calquesEcran} " +
                    "(manifest.json absent). Le dossier art/loading-screen/assets n'est pas dans le depot ; " +
                    "il faut le poser a cet endroit avant de construire le jar de service.")
        }
    }
}
tasks.named('processEarlywindowResources', ProcessResources).configure {
    dependsOn verifierCalques
    from(calquesEcran) {
        into 'lostisland/loading'
        // Copies des flammes vanilla (bake_fx.py) : la scène les lit dans le jar du client, on ne livre aucun
        // fichier de Mojang dans le nôtre (licence).
        exclude 'fx/fire_*_strip.png'
    }
}

// Rendus de contrôle de la scène, hors du jeu : fenêtre GLFW cachée, PNG dans build/scene-snapshots.
// Les bibliothèques natives de LWJGL (version de Minecraft 1.20.1) viennent du cache Gradle.
def lwjglNatives = { ->
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    os.contains('win') ? 'natives-windows' : (os.contains('mac') ? 'natives-macos' : 'natives-linux')
}()
configurations { sceneSnapshotNatives }
dependencies {
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-stb'].each {
        sceneSnapshotNatives "org.lwjgl:${it}:3.3.1:${lwjglNatives}"
    }
}
tasks.register('sceneSnapshot', JavaExec) {
    group = 'verification'
    description = 'Rend des images fixes de la scene de chargement (--args="--t 3,12 --size 1920x1080").'
    classpath = sourceSets.earlywindowTest.runtimeClasspath + sourceSets.earlywindow.output +
            configurations.sceneSnapshotNatives
    mainClass = 'dev.oneforallsurvival.earlywindow.scene.SceneSnapshot'
    workingDir = project.projectDir
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

// Essais en développement : le jar de service va dans run/mods, comme dans le dossier mods d'un vrai client.
tasks.register('installEarlyWindow', Copy) {
    group = 'build'
    description = 'Copie le jar de service de la fenêtre anticipée dans run/mods.'
    from earlyWindowJar
    into project.file('run/mods')
    doFirst {
        // Une ancienne version laissée à côté serait chargée elle aussi.
        delete project.fileTree('run/mods').matching { include "${mod_id}-earlywindow-*.jar" }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach {
    mustRunAfter 'installEarlyWindow'
}

// Dossier de `titleFr` : le jar de service est recopié à chaque fois (il change), fml.toml et options.txt
// ne sont écrits que s'ils manquent, pour ne pas écraser ce qu'on y règle à la main. Écriture en UTF-8 sans BOM.
def titleRunDir = project.file('run-titre')
def copyTitleJar = tasks.register('copyTitleJar', Copy) {
    description = 'Recopie le jar de service dans run-titre/mods (incrémental).'
    from earlyWindowJar
    into new File(titleRunDir, 'mods')
    doFirst {
        delete project.fileTree(new File(titleRunDir, 'mods')).matching { include "${mod_id}-earlywindow-*.jar" }
    }
}
// Toujours exécutée (aucune sortie déclarée) : recrée fml.toml et options.txt s'ils manquent.
def prepareTitleRun = tasks.register('prepareTitleRun') {
    group = 'build'
    description = 'Prépare run-titre/ : jar de service, fml.toml (fenêtre lostisland) et options.txt en français.'
    dependsOn copyTitleJar
    doLast {
        def fml = new File(titleRunDir, 'config/fml.toml')
        if (!fml.exists()) {
            fml.parentFile.mkdirs()
            fml.write("""#Early window height
earlyWindowHeight = 480
#Enable forge global version checking
versionCheck = true
#Should we control the window. Disabling this disables new GL features and can be bad for mods that rely on them.
earlyWindowControl = true
#Early window framebuffer scale
earlyWindowFBScale = 1
#Early window provider
earlyWindowProvider = "lostisland"
#Early window width
earlyWindowWidth = 854
#Early window starts maximized
earlyWindowMaximized = false
#Default config path for servers
defaultConfigPath = "defaultconfigs"
#Disables Optimized DFU client-side - already disabled on servers
disableOptimizedDFU = true
#Skip specific GL versions, may help with buggy graphics card drivers
earlyWindowSkipGLVersions = []
#Whether to log a help message on first attempt, to aid troubleshooting. This setting should automatically disable itself after a successful launch
earlyWindowLogHelpMessage = false
#Max threads for early initialization parallelism,  -1 is based on processor count
maxThreads = -1
#Squir?
earlyWindowSquir = false
#Whether to show CPU usage stats in early window
earlyWindowShowCPU = false
""", 'UTF-8')
        }
        def options = new File(titleRunDir, 'options.txt')
        if (!options.exists()) {
            options.write('lang:fr_fr' + '\n', 'UTF-8')
        }
    }
}
tasks.matching { it.name == 'runTitleFr' }.configureEach {
    dependsOn prepareTitleRun
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
