# ASCII only: Java reads .properties files as ISO-8859-1, accents would be garbled in game.
# Memory for Gradle, required by the Minecraft decompilation step.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.28
# Range: the jar was checked on 47.4.23 and 47.4.28 only, and two mixin targets are private to Forge
# (VanillaInventoryCodeHooks lambda, SlotItemHandler); a Forge upgrade must be rechecked before widening.
forge_version_range=[47.4.23,47.5)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1


## Mod Properties

# Must match OneForAllSurvival.MODID.
mod_id=oneforallsurvival
mod_name=One For All Survival
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=dev.oneforallsurvival
mod_authors=JLSkyzer
mod_description=One For All Survival.


## Development pack (versions of the mods loaded by the dev runs)
# Modrinth versions shared by several loaders (create-new-age 1.2.0+mc1.20.1, hospitals 4.0.0) are
# referenced by version id: the version number resolved to the Fabric/NeoForge jar, not the Forge one.
# create-new-age = 1.2.0+mc1.20.1 forge, hospitals = 4.0.0 forge 1.20.1.

farmersdelight_version=1.20.1-1.3.4
create_version=mc1.20.1-6.0.8
createaddition_version=forge-1.20.1-1.3.3
createnewage_version=7vnwbouk
advancedelectricity_file=9362725
hospitals_version=h2fZRbSr
medicalremedies_file=8023446
firstaid_file=5531834
crafttweaker_version=14.0.60
jei_version=15.74.0.234
junit_version=5.10.2
# Must follow the esl jar nested in create-new-age (META-INF/jars/); libs/esl-forge-1.20.1-<version>.jar must be
# the same file. Licence: libs/LICENSE-esl.txt.
esl_version=1.1.3

## Phone browser (MCEF, CinemaMod). Client only, optional at run time (-PwithMcef).
# mcef = 2.1.6 forge 1.20.1, Modrinth version id x91l6OKB (same file as the pack).
# webdisplays = 2.0.2-1.20.1, Modrinth version id DHWqG6SF. Version ids, as above: the number is ambiguous.
mcef_version=x91l6OKB

## Simple Voice Chat (calls of the phone). Mandatory on server and clients.
# simple-voice-chat = forge-1.20.1-2.6.22, Modrinth version id S11m0QIb (same file as the pack).
# voicechat-api = the server API the mod compiles against (maven.maxhenkel.de).
voicechat_version=S11m0QIb
voicechat_api_version=2.6.20
webdisplays_version=DHWqG6SF

## Title screen and HUD compatibility trials (lot C), loaded only on demand.
# -PwithQuickSkin: quick-skin = mc1.20.1-v4.1.0-forge, Modrinth version id d5H89YqA (sha1 47675d73..., same file as
# the pack) and its dependency architectury-api = 9.2.14+forge, id 1MKTLiiG (sha1 a52918a5..., same file as the pack).
quickskin_version=d5H89YqA
quickskin_sha1=47675d739c0a7c36ebec1fdf5c02baa504af3541
architectury_version=1MKTLiiG
# -PwithReggadium: Reggadium 1.3-beta is on neither Modrinth nor a public maven; the pack's jar is copied by hand to
# libs/reggadium-forge-1.20.1-<version>.jar (not versioned, LGPL-3.0 per its mods.toml) and checked by its sha1.
reggadium_version=1.3-beta
reggadium_sha1=2edba9937f3477a85593d0fab712a5505b9ff349
