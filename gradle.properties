# ASCII only: Java reads .properties files as ISO-8859-1, accents would be garbled in game.
# Memory for Gradle, required by the Minecraft decompilation step.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.28
# Lower bound: the mod constructor receives FMLJavaModLoadingContext, which needs at least 47.3.10.
forge_version_range=[47.4,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1


## Mod Properties

# Must match OneForAllSurvival.MODID.
mod_id=oneforallsurvival
mod_name=One For All Survival
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=dev.oneforallsurvival
mod_authors=JLSkyzer
mod_description=One For All Survival.
