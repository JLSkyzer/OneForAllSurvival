# referenced by version id: the version number resolved to the Fabric/NeoForge jar, not the Forge one.
# create-new-age = 1.2.0+mc1.20.1 forge, hospitals = 4.0.0 forge 1.20.1.

farmersdelight_version=1.20.1-1.3.4
create_version=mc1.20.1-6.0.8
createaddition_version=forge-1.20.1-1.3.3
createnewage_version=7vnwbouk
advancedelectricity_file=9362725
hospitals_version=h2fZRbSr
medicalremedies_file=8023446
firstaid_file=5531834
crafttweaker_version=14.0.60
junit_version=5.10.2
