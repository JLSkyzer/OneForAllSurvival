modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    mandatory=true
    # Bytecode lu sur 1.20.1-1.3.4 (mixins des quêtes : hors de cette version, ils ne s'appliquent pas).
    versionRange="[1.20.1-1.3.4,1.20.1-1.4)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=true
    # Simple Voice Chat : la voix des appels du téléphone (API serveur 2.6.20, mod du pack 2.6.22).
    versionRange="[1.20.1-2.6.22,1.20.1-2.7)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mcef"
    mandatory=false
    # 2.1.6 de CinemaMod ; 2.2 et plus (fork de Keksuccino) a une autre API.
    versionRange="[2.1.6,2.2)"
    ordering="NONE"
    side="CLIENT"
